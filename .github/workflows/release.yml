# Tags and releases the next patch version on every push to master
# (buildpipeline's go-library-release.yml), so services require real versions
# and Renovate offers version bumps instead of commit-hash updates.
name: Release

on:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  release:
    permissions:
      contents: write
    uses: Preciselyco/buildpipeline/.github/workflows/go-library-release.yml@main
